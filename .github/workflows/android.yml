name: Android

on:
  push:
    branches: [ main, "codex/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Android lint
        run: ./gradlew lintDebug

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Build unsigned release APK
        run: ./gradlew assembleRelease

      - name: Rename APKs
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/TransformaTuBody-v1.0.0-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk artifacts/TransformaTuBody-v1.0.0-release-unsigned.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TransformaTuBody-APKs
          path: artifacts/*.apk

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk

